# Docker Compose for local development and staging deployment

services:
  avs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avs
    ports:
      - "9100:9100"
    environment:
      - AVS_BIND_ADDR=0.0.0.0:9100
      - AVS_SIGNING_KEY_PATH=/secrets/avs-signing-key.pem
      - AVS_EXPECTED_MRSIGNER=${AVS_EXPECTED_MRSIGNER:-}
      - AVS_EXPECTED_MRENCLAVE=${AVS_EXPECTED_MRENCLAVE:-}
      - AVS_ALLOW_DEBUG_ENCLAVE=1
      - RUST_LOG=info,attestation_verification_service=debug
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  avs-dev:
    image: rust:1.82-bookworm
    container_name: avs-dev
    working_dir: /app
    command: >
      bash -c "
        apt-get update && apt-get install -y pkg-config libssl-dev curl &&
        cargo install cargo-watch &&
        cargo watch -x run
      "
    ports:
      - "9100:9100"
    environment:
      - AVS_BIND_ADDR=0.0.0.0:9100
      - AVS_SIGNING_KEY_PATH=/secrets/avs-signing-key.pem
      - AVS_ALLOW_DEBUG_ENCLAVE=1
      - RUST_LOG=debug
    volumes:
      - .:/app
      - ./secrets:/secrets:ro
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    profiles:
      - dev

volumes:
  cargo-cache:
  target-cache:
