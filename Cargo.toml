[package]
name = "attestation-verification-service"
version = "0.1.0"
edition = "2021"
authors = ["Relational Network"]
description = "Enclave Verification Service"
license = "AGPL-3.0-or-later"
rust-version = "1.92"

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
dotenvy = "0.15.7"
httparse = "1.10.1"
hyper = { version = "1.6.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.11", features = ["tokio"] }
# Upgraded to v10 to align with relational-sdk and fix P-256 support
# rust_crypto feature provides the CryptoProvider required by v10
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["use_pem", "p256", "rust_crypto"] }
libloading = "0.8.9"
openssl = "0.10.74"
p256 = { version = "0.13.2", features = ["pem", "pkcs8"] }
# Added for Clerk JWKS fetching
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "fs"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.2", features = ["util"] }
tower-service = "0.3.3"
rustls = { version = "0.23.26", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
