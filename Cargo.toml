[package]
name = "attestation-verification-service"
version = "0.1.0"
edition = "2021"
authors = ["Relational Network"]
description = "Enclave Verification Service"
license = "AGPL-3.0-or-later"
rust-version = "1.92"

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
dotenvy = "0.15.7"
httparse = "1.10.1"
jsonwebtoken = "9.3.0"
libloading = "0.8.9"
openssl = "0.10.74"
p256 = { version = "0.13.2", features = ["pem", "pkcs8"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
