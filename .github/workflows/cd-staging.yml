name: CD - Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: relational-network/attestation-verification-service

jobs:
  build-and-push:
    name: Build and Push AVS Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Build AVS binary (native)
        run: |
          CC=clang CXX=clang++ cargo build --release
          cp target/release/attestation-verification-service avs-binary

      - name: Validate AVS binary
        run: |
          echo "=== Validating AVS binary ==="
          
          # Check binary exists
          if [ ! -f avs-binary ]; then
            echo "ERROR: avs-binary not found!"
            exit 1
          fi
          
          # Check binary size (should be > 1MB for full binary)
          SIZE=$(stat -c%s avs-binary)
          echo "Binary size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: Binary size too small ($SIZE bytes), likely incomplete!"
            exit 1
          fi
          
          # Check binary is executable
          if [ ! -x avs-binary ]; then
            echo "ERROR: Binary is not executable!"
            chmod +x avs-binary
          fi
          
          # Verify it's a Linux ELF binary
          if ! file avs-binary | grep -q "ELF 64-bit"; then
            echo "ERROR: Not a valid Linux 64-bit ELF binary!"
            file avs-binary
            exit 1
          fi
          
          # Smoke test - verify it can display help/version (with short timeout)
          echo "Running smoke test..."
          timeout 5s ./avs-binary --help || echo "Note: --help may not be implemented, continuing..."
          
          echo "=== Binary validation passed ==="

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: relational-network
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -e

            echo "=== AVS Deploy ==="
            echo "Started at: $(date)"

            echo "=== Logging into GHCR ==="
            echo "$GHCR_TOKEN" | docker login ghcr.io -u relational-network --password-stdin

            echo "=== Pulling latest image ==="
            docker pull ghcr.io/relational-network/attestation-verification-service:staging-latest

            echo "=== Restarting AVS service ==="
            sudo systemctl restart avs

            echo "=== Waiting for AVS to start ==="
            sleep 10

            echo "=== Checking AVS health ==="
            curl -sf http://127.0.0.1:9100/health || {
              echo "Health check failed!"
              sudo journalctl -u avs -n 50 --no-pager
              exit 1
            }

            echo "=== AVS deployed successfully ==="
            echo "Completed at: $(date)"

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for service to stabilize
        run: sleep 15

      - name: Health check via public URL
        run: |
          echo "Checking AVS health via Caddy..."
          curl -sf https://iob-staging.duckdns.org/.well-known/jwks.json || echo "JWKS check (may fail if Caddy not configured)"
          echo ""
          echo "AVS deployment complete!"
