name: CD - Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: relational-network/attestation-verification-service

jobs:
  build-and-push:
    name: Build and Push AVS Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: relational-network
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Copy service file to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: scripts/avs.service
          target: /tmp/avs-deploy

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -e

            echo "=== AVS Deploy ==="
            echo "Started at: $(date)"

            echo "=== Logging into GHCR ==="
            echo "$GHCR_TOKEN" | docker login ghcr.io -u relational-network --password-stdin

            echo "=== Pulling latest image ==="
            docker pull ghcr.io/relational-network/attestation-verification-service:staging-latest

            echo "=== Deploying service file ==="
            sudo cp /tmp/avs-deploy/scripts/avs.service /etc/systemd/system/avs.service
            sudo systemctl daemon-reload

            echo "=== Restarting AVS service ==="
            sudo systemctl restart avs

            echo "=== Waiting for AVS to start ==="
            sleep 10

            echo "=== Checking AVS health ==="
            curl -sf http://127.0.0.1:9100/health || {
              echo "Health check failed!"
              sudo journalctl -u avs -n 50 --no-pager
              exit 1
            }

            echo "=== AVS deployed successfully ==="
            echo "Completed at: $(date)"

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for service to stabilize
        run: sleep 15

      - name: Health check via public URL
        run: |
          echo "Checking AVS health via Caddy..."
          curl -sf https://iob-staging.duckdns.org/.well-known/jwks.json || echo "JWKS check (may fail if Caddy not configured)"
          echo ""
          echo "AVS deployment complete!"